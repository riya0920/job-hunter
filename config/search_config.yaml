# ---- Freshness / Urgency ----
# Jobs first seen within `urgent_minutes` are flagged URGENT and floated to the
# top of alerts, so you hit the truly-fresh ones first.
freshness:
  urgent_minutes: 15
  # Ignore ATS postings whose real post date is older than this many hours,
  # even if we've never seen them (avoids surfacing stale backlog as "new").
  max_post_age_hours: 72

# ---- Cold-start guard ----
# The FIRST time we poll a company's board, silently record its current jobs as
# "seen" without alerting — so adding a new company never floods you with old
# postings marked as new. Only jobs that appear AFTER that first poll alert you.
cold_start:
  silent_first_poll: true

# ---- Notifications behavior ----
notifications:
  # Push every match above notify_score (not just high-match). You asked for
  # instant push + email on every match.
  push_every_match: true
  # Don't send a "no new jobs" push on the fast loop — that would be spam at a
  # 5-minute cadence. A daily heartbeat covers "is it still alive?" instead.
  push_when_empty: false
  # Send a daily heartbeat so you know the hunter is alive even on quiet days.
  daily_heartbeat: true

# ---- Instant-apply assist ----
# For strong matches, draft a one-line resume-grounded pitch (via Gemini) so you
# can apply within minutes. Needs GEMINI_API_KEY. Costs a fraction of a cent per
# job. Skips silently if the key is absent.
tailor:
  enabled: true
  min_score: 60      # only draft for matches at/above this score
  max_jobs: 8        # cap per cycle for cost control
  model: gemini-2.5-flash