    host: wd5
    site: NVIDIAExternalCareerSite
  - name: Salesforce
    tenant: salesforce
    host: wd12
    site: External_Career_Site
  - name: Adobe
    tenant: adobe
    host: wd5
    site: external_experienced
  - name: Workday
    tenant: workday
    host: wd5
    site: Workday
  - name: Capital One
    tenant: capitalone
    host: wd12
    site: Capital_One
  - name: Comcast
    tenant: comcast
    host: wd5
    site: Comcast_Careers

# ---- Staffing / recruiter filter ----
# Drops staffing-agency and body-shop reposts so they never alert. This was the
# #1 source of bogus "urgent" pings in v1 (they flood LinkedIn/Indeed).
staffing:
  enabled: true
  # Matched against the COMPANY NAME (narrow, to avoid nuking real employers).
  exclude_company_patterns:
    - "staffing"
    - "staff aug"
    - "recruiting"
    - "recruitment"
    - "recruiters"
    - "resourcing"
    - "talent solutions"
    - "talent partners"
    - "talent group"
    - "placement"
    - "search partners"
    - "consulting group"
    - "consultancy"
    - "manpower"
    - "workforce solutions"
    - "it services"
    - "staffing agency"
  # Matched against TITLE + DESCRIPTION — phrases only staffing posts use.
  exclude_description_patterns:
    - "our client"
    - "on behalf of our client"
    - "end client"
    - "client is seeking"
    - "client is looking"
    - "corp to corp"
    - "corp-to-corp"
    - "c2c"
    - "w2 only"
    - "w-2 only"
    - "1099"
    - "contract to hire"
    - "contract-to-hire"
    - "multiple positions available"
    - "multiple openings"
    - "submit your resume for consideration"
    - "staffing firm"
    - "staffing agency"
    - "we are a staffing"
    - "third party agencies"
    - "recruiting agency"

# ---- Additional Free API Sources ----
# These are scraped directly alongside ATS boards
extra_api_sources:
  # Wellfound (AngelList) — startup jobs
  wellfound: true
  # Remotive — remote AI jobs
  remotive: true
  # USAJobs — federal government AI positions
  usajobs: true

# ---- Scoring Configuration ----
scoring:
  # Minimum score (0-100) to include in results
  min_score: 30
  # Minimum score to trigger email notification
  notify_score: 50
  # Weights for combined scoring
  weights:
    keyword: 0.20
    semantic: 0.30
    llm: 0.50

