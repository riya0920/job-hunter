# SmartRecruiters companies (api.smartrecruiters.com/v1/companies/{slug}/postings)
# Free public API, no auth. The slug is CASE-SENSITIVE and is the company id in
# their careers URL: jobs.smartrecruiters.com/{slug}. Verify a slug by opening
#   https://api.smartrecruiters.com/v1/companies/{slug}/postings
# in a browser before adding it — many guesses return an empty list.
smartrecruiters_companies:
  - Visa   # verified live

# Workday companies (per-tenant CXS endpoint).
# Each needs: tenant (subdomain), site (careers site name), host (wd1/wd3/wd5).
# Find these by opening the company's Workday careers page and reading the URL:
#   https://{tenant}.{host}.myworkdayjobs.com/{site}
# This is where big employers (F500, banks, Amazon) post FIRST.
workday_companies:
  - name: Nvidia
